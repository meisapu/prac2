<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Responsive Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MySite</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<!-- Alert -->
<div class="container mt-3">
  <div class="alert alert-success text-center">
    Welcome to our Responsive Bootstrap Webpage!
  </div>
</div>

<!-- Main Content -->
<div class="container mt-4">
  <div class="row">

    <!-- Left Content -->
    <div class="col-md-8">
      <h2>About Us</h2>
      <p>This webpage is built using Bootstrap Grid and Components.</p>
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-danger">Danger</button>
    </div>

    <!-- Right Card -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Information Card</h5>
          <p class="card-text">Cards are flexible and responsive content containers.</p>
          <a href="#" class="btn btn-success">Learn More</a>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Contact Form -->
<div class="container mt-5">
  <h3>Contact Form</h3>
  <form>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Enter your email">
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-4">
  <p>© 2026 MySite</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
